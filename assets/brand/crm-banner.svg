<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" width="1600" height="260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E6"/>
      <stop offset="1" stop-color="#F8E2B4"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#D9A13A" opacity=".22"/>
    </pattern>
    <g id="env">
      <rect x="0" y="0" width="58" height="40" rx="7" fill="#fff" stroke="#1D1B18" stroke-width="3"/>
      <path d="M3 5 L29 25 L55 5" fill="none" stroke="#1D1B18" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <path id="spark" d="M0 -12 C2 -3 3 -2 12 0 C3 2 2 3 0 12 C-2 3 -3 2 -12 0 C-3 -2 -2 -3 0 -12Z"/>
    <g id="coin">
      <circle r="17" fill="#F2C14E" stroke="#8A5A0B" stroke-width="3"/>
      <circle r="10" fill="none" stroke="#C98B1E" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1600" height="260" fill="url(#sky)"/>
  <rect width="1600" height="260" fill="url(#dots)"/>
  <circle cx="70" cy="40" r="90" fill="#F6D27F" opacity=".25"/>
  <circle cx="700" cy="230" r="120" fill="#F6D27F" opacity=".18"/>
  <circle cx="1290" cy="10" r="110" fill="#FBE3A8" opacity=".55"/>
  <circle cx="1560" cy="200" r="80" fill="#F6D27F" opacity=".22"/>

  <g transform="translate(0 14)">
  <!-- the journey path -->
  <path d="M398 100 C 520 18, 640 160, 790 98 S 990 40, 1110 92" fill="none" stroke="#C9A25A" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- floating coins -->
  <use href="#coin" x="150" y="62"/>
  <use href="#coin" x="118" y="118" transform="rotate(-12 118 118)"/>
  <use href="#coin" x="182" y="150"/>
  <text x="150" y="68" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="15" fill="#8A5A0B">$</text>
  <text x="182" y="156" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="15" fill="#8A5A0B">$</text>

  <!-- the customer's banking app -->
  <g transform="translate(232 20) rotate(-7)">
    <rect x="0" y="0" width="128" height="206" rx="22" fill="#1D1B18"/>
    <rect x="7" y="9" width="114" height="188" rx="16" fill="#FFFDF7"/>
    <path d="M7 25 a16 16 0 0 1 16 -16 h82 a16 16 0 0 1 16 16 v20 h-114 z" fill="#D9A13A"/>
    <rect x="49" y="13" width="30" height="5" rx="2.5" fill="#1D1B18"/>
    <text x="19" y="38" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#fff">Welcome!</text>
    <circle cx="23" cy="64" r="8" fill="#6AAA5C"/><path d="M19 64 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="37" y="68" font-family="Arial, sans-serif" font-size="11.5" fill="#1D1B18">Sign up</text>
    <circle cx="23" cy="88" r="8" fill="#6AAA5C"/><path d="M19 88 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="37" y="92" font-family="Arial, sans-serif" font-size="11.5" fill="#1D1B18">Verify ID</text>
    <circle cx="23" cy="112" r="8" fill="#FBECCD" stroke="#D9A13A" stroke-width="2.4" stroke-dasharray="3 2.5"/>
    <text x="37" y="116" font-family="Arial, sans-serif" font-weight="700" font-size="11.5" fill="#8A5A0B">First deposit</text>
    <rect x="17" y="130" width="94" height="8" rx="4" fill="#EFE5D0"/>
    <rect x="17" y="130" width="62" height="8" rx="4" fill="#D9A13A"/>
    <rect x="17" y="152" width="94" height="28" rx="14" fill="#1D1B18"/>
    <text x="64" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#fff">Deposit</text>
  </g>

  <!-- 1 · AI drafts the email -->
  <g transform="translate(478 52) rotate(-10)"><use href="#env"/></g>
  <use href="#spark" x="560" y="44" fill="#D9A13A"/>
  <use href="#spark" x="585" y="74" fill="#D9A13A" transform="translate(585 74) scale(.55) translate(-585 -74)"/>
  <use href="#spark" x="462" y="40" fill="#E8B84A" transform="translate(462 40) scale(.45) translate(-462 -40)"/>
  <g transform="translate(456 0)">
    <rect x="0" y="6" width="118" height="26" rx="13" fill="#fff" stroke="#E7D3A8" stroke-width="2"/>
    <text x="59" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#8A5A0B">1 · AI drafts</text>
  </g>

  <!-- 2 · the manager judges: the process waits here -->
  <g transform="translate(0 0)">
    <rect x="768" y="6" width="184" height="26" rx="13" fill="#1D1B18"/>
    <text x="860" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#fff">2 · Manager approves</text>
    <circle cx="860" cy="100" r="56" fill="#fff" stroke="#1D1B18" stroke-width="3.5"/>
    <circle cx="860" cy="100" r="47" fill="#FBECCD"/>
    <!-- shoulders and suit -->
    <path d="M818 146 Q818 122 860 120 Q902 122 902 146 Z" fill="#142544"/>
    <path d="M850 121 L860 140 L870 121 Z" fill="#fff"/>
    <path d="M857 124 h6 l2 14 l-5 5 l-5 -5 z" fill="#D9A13A"/>
    <!-- face -->
    <circle cx="860" cy="92" r="24" fill="#F6D3B5"/>
    <path d="M836 90 Q835 64 860 63 Q886 64 884 90 Q880 76 866 74 Q852 82 838 80 Z" fill="#2B2420"/>
    <circle cx="851" cy="94" r="3" fill="#1D1B18"/><circle cx="869" cy="94" r="3" fill="#1D1B18"/>
    <circle cx="845" cy="102" r="4" fill="#EE9C8E" opacity=".55"/><circle cx="875" cy="102" r="4" fill="#EE9C8E" opacity=".55"/>
    <path d="M853 104 Q860 110 867 104" fill="none" stroke="#1D1B18" stroke-width="2.5" stroke-linecap="round"/>
    <!-- approve stamp -->
    <circle cx="906" cy="62" r="19" fill="#6AAA5C" stroke="#fff" stroke-width="4"/>
    <path d="M897 62 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3 · the email is sent -->
  <g transform="translate(1016 56) rotate(-8)"><use href="#env"/></g>
  <path d="M990 66 h-20 M994 80 h-30 M998 94 h-18" stroke="#C9A25A" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(998 0)">
    <rect x="0" y="6" width="120" height="26" rx="13" fill="#fff" stroke="#E7D3A8" stroke-width="2"/>
    <text x="60" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#8A5A0B">3 · Email sent</text>
  </g>

  <!-- wordmark -->
  <text x="1176" y="84" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#1D1B18">Banking <tspan font-style="italic" fill="#8A5A0B">CRM</tspan></text>
  <text x="1179" y="114" font-family="Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="4.5" fill="#8A5A0B">FIRST-DEPOSIT ONBOARDING</text>
  </g>
</svg>
